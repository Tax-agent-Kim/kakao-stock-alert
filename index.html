<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>리밸런싱 장부</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --paper:#EEF0EA; --paper-2:#E4E7DF; --ink:#1C2B28; --ink-soft:#5B6A63;
    --line:#C7CDC1; --jade:#1F6F5C; --jade-soft:#DDEAE3; --rust:#A63A2E;
    --rust-soft:#F3DEDA; --amber:#9C6B14; --amber-soft:#F1E4C8; --navy:#22344A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans KR',sans-serif;background:var(--paper);color:var(--ink);}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  .masthead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px;}
  .masthead h1{font-family:'Source Serif 4',serif;font-weight:700;font-size:26px;margin:0;}
  .masthead .sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .updated{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:right;}

  .tabs{display:flex;gap:2px;margin-bottom:20px;background:var(--paper-2);padding:3px;border-radius:8px;width:fit-content;}
  .tab-btn{font-family:'IBM Plex Sans KR';font-size:13.5px;font-weight:600;padding:8px 16px;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:6px;}
  .tab-btn.active{background:var(--ink);color:var(--paper);}
  .panel{display:none;} .panel.active{display:block;}

  .alert-box{border:1.5px solid var(--rust);background:var(--rust-soft);border-radius:10px;padding:14px 16px;margin-bottom:22px;}
  .alert-box.empty{border-color:var(--line);background:var(--paper-2);}
  .alert-title{font-weight:700;font-size:13px;margin-bottom:8px;}
  .alert-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px dashed rgba(0,0,0,.12);}
  .alert-row:first-of-type{border-top:none;}

  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px;}
  .card h2{font-family:'Source Serif 4',serif;font-size:16px;margin:0 0 12px;}

  .add-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center;}
  .add-form input, .add-form select{font-family:'IBM Plex Sans KR';font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);}
  .add-form .name{width:130px;} .add-form .num{width:100px;font-family:'IBM Plex Mono';}
  .btn{font-family:'IBM Plex Sans KR';font-weight:600;font-size:13px;padding:8px 14px;border-radius:6px;border:none;cursor:pointer;background:var(--ink);color:var(--paper);}
  .btn:hover{background:var(--navy);} .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}

  .row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:13px;}
  .row:first-of-type{border-top:none;}
  .row.watch{grid-template-columns:auto 1fr auto auto auto;}
  .row-name{font-weight:600;} .row-ticker{color:var(--ink-soft);font-family:'IBM Plex Mono';font-size:11px;margin-left:6px;}
  .market-tag{font-size:10.5px;font-family:'IBM Plex Mono';padding:2px 6px;border-radius:4px;background:var(--paper-2);color:var(--ink-soft);width:fit-content;}
  .change-pct{font-family:'IBM Plex Mono';font-weight:600;font-size:13px;text-align:right;min-width:64px;}
  .change-pct.up{color:var(--jade);} .change-pct.down{color:var(--rust);} .change-pct.flat{color:var(--ink-soft);}
  .signal{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;text-align:center;white-space:nowrap;}
  .signal.hold{background:var(--jade-soft);color:var(--jade);}
  .signal.buy{background:#DCE6F1;color:var(--navy);}
  .signal.sell{background:var(--amber-soft);color:var(--amber);}
  .signal.sellall{background:var(--rust-soft);color:var(--rust);}
  .signal.unknown{background:var(--paper-2);color:var(--ink-soft);}
  .del-btn{background:none;border:none;color:#B3BAB1;cursor:pointer;font-size:15px;}
  .del-btn:hover{color:var(--rust);}
  .empty-state{padding:24px 0;text-align:center;color:var(--ink-soft);font-size:13px;}
  .note{font-size:12px;color:var(--ink-soft);line-height:1.6;}

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:10;}
  .modal-bg.active{display:flex;}
  .modal{background:#fff;border-radius:12px;padding:22px;width:min(360px,90vw);}
  .modal h3{font-family:'Source Serif 4',serif;margin:0 0 6px;font-size:17px;}
  .modal p{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;line-height:1.6;}
  .modal input{width:100%;font-family:'IBM Plex Mono';font-size:18px;letter-spacing:.1em;text-align:center;padding:12px 10px;border:1px solid var(--line);border-radius:6px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .status-msg{font-size:12px;margin-top:10px;min-height:16px;}
  .status-msg.err{color:var(--rust);} .status-msg.ok{color:var(--jade);}

  .search-wrap{position:relative;}
  .search-dropdown{
    position:absolute;top:calc(100% + 4px);left:0;min-width:240px;max-width:320px;
    background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.1);
    z-index:20;max-height:240px;overflow-y:auto;display:none;
  }
  .search-dropdown.active{display:block;}
  .search-item{padding:9px 12px;cursor:pointer;font-size:13px;border-top:1px solid var(--paper-2);}
  .search-item:first-child{border-top:none;}
  .search-item:hover{background:var(--paper);}
  .search-item .si-name{font-weight:600;}
  .search-item .si-code{font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);margin-left:6px;}
  .search-item .si-extra{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}
  .search-empty{padding:10px 12px;font-size:12px;color:var(--ink-soft);}

  @media (max-width:640px){ .row{grid-template-columns:1fr;gap:6px;} .add-form input,.add-form .name{width:100%;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <h1>리밸런싱 장부</h1>
      <div class="sub">매입가 대비 등락률 기준 자동 매매 신호 · GitHub Actions 자동 갱신</div>
    </div>
    <div class="updated" id="updatedAt">불러오는 중...</div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
    <button class="btn ghost" id="refreshNowBtn">🔄 지금 시세 조회</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dashboard">대시보드</button>
    <button class="tab-btn" data-tab="holdings">보유종목 관리</button>
    <button class="tab-btn" data-tab="watchlist">관심종목 관리</button>
  </div>

  <div class="panel active" id="panel-dashboard">
    <div id="alertBox"></div>
    <div class="card">
      <h2>보유종목 현황</h2>
      <div id="dashList"></div>
    </div>
    <div class="card">
      <h2>관심종목 현황</h2>
      <div id="dashWatchList"></div>
    </div>
  </div>

  <div class="panel" id="panel-holdings">
    <div class="card">
      <h2>보유종목 추가</h2>
      <div class="add-form">
        <select id="h-market"><option value="domestic">국내</option><option value="overseas">해외</option></select>
        <div class="search-wrap">
          <input class="name" id="h-name" placeholder="종목명 검색 (예: 삼성전자)" autocomplete="off"/>
          <div class="search-dropdown" id="h-dropdown"></div>
        </div>
        <input class="num" id="h-code" placeholder="코드/티커 (자동입력)"/>
        <input class="num" id="h-buy" placeholder="매입가" type="number" step="any"/>
        <button class="btn" id="h-add-btn">추가</button>
      </div>
      <div id="h-status" class="status-msg"></div>
      <div id="holdingsList"></div>
    </div>
  </div>

  <div class="panel" id="panel-watchlist">
    <div class="card">
      <h2>관심종목 추가</h2>
      <div class="add-form">
        <select id="w-market"><option value="domestic">국내</option><option value="overseas">해외</option></select>
        <div class="search-wrap">
          <input class="name" id="w-name" placeholder="종목명 검색" autocomplete="off"/>
          <div class="search-dropdown" id="w-dropdown"></div>
        </div>
        <input class="num" id="w-code" placeholder="코드/티커 (자동입력)"/>
        <button class="btn" id="w-add-btn">즐겨찾기 추가</button>
      </div>
      <div id="w-status" class="status-msg"></div>
      <div id="watchList"></div>
    </div>
  </div>

  <p class="note">
    여기서 추가·삭제한 내용은 저장소의 <code>data/holdings.json</code>에 자동으로 커밋됩니다.
    커밋되면 GitHub Actions가 곧바로 시세를 다시 계산합니다 (보통 1~2분 소요).
  </p>
</div>

<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h3>PIN 입력</h3>
    <p>종목을 추가·삭제하려면 PIN이 필요합니다. 한 번 입력하면 이 기기에서는 다시 묻지 않습니다.</p>
    <input id="pin-input" type="password" inputmode="numeric" placeholder="••••"/>
    <div id="pin-status" class="status-msg"></div>
    <div class="actions">
      <button class="btn ghost" id="pin-cancel">취소</button>
      <button class="btn" id="pin-confirm">확인</button>
    </div>
  </div>
</div>

<script>
(function(){
  const PIN_KEY = 'rebalance_pin';

  function getPin(){ return localStorage.getItem(PIN_KEY) || ''; }
  function setPin(pin){ localStorage.setItem(PIN_KEY, pin); }

  function fmtPct(c){ if(c===null||c===undefined) return '—'; return (c>0?'+':'')+c.toFixed(1)+'%'; }
  function fmtNum(n){ if(n===null||n===undefined||n==='') return '—'; const num = Number(n); if(isNaN(num)) return n; return num.toLocaleString('ko-KR'); }
  function pctClass(c){ if(c===null||c===undefined) return 'flat'; if(c>0.001) return 'up'; if(c<-0.001) return 'down'; return 'flat'; }
  function signalHTML(type, label){
    const cls = type==='buy'?'buy':type==='sell'?'sell':type==='sellall'?'sellall':type==='unknown'?'unknown':'hold';
    return `<span class="signal ${cls}">${label}</span>`;
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  let holdingsFile = { holdings: [], watchlist: [] };
  let statusData = null;
  let krxStocks = null; // 국내 종목 로컬 검색용 (공식 KRX 목록)

  async function loadKrxStocks(){
    if(krxStocks) return krxStocks;
    try{
      const data = await fetch('data/krx_stocks.json', {cache:'no-store'}).then(r=>r.json());
      krxStocks = data.stocks || [];
    }catch(e){
      console.error('KRX 목록 로드 실패', e);
      krxStocks = [];
    }
    return krxStocks;
  }

  async function loadPublicData(){
    try{
      const [h, s] = await Promise.all([
        fetch('data/holdings.json', {cache:'no-store'}).then(r=>r.json()),
        fetch('data/status.json', {cache:'no-store'}).then(r=>r.json()).catch(()=>null),
      ]);
      holdingsFile = h;
      statusData = s;
    }catch(e){ console.error(e); }
  }

  function mergedHoldings(){
    const statusMap = {};
    (statusData?.holdings || []).forEach(h=>{ statusMap[h.id] = h; });
    return (holdingsFile.holdings || []).map(h => ({...h, ...(statusMap[h.id]||{})}));
  }

  function mergedWatchlist(){
    const statusMap = {};
    (statusData?.watchlist || []).forEach(w=>{ statusMap[w.id] = w; });
    return (holdingsFile.watchlist || []).map(w => ({...w, ...(statusMap[w.id]||{})}));
  }

  function renderDashboard(){
    document.getElementById('updatedAt').textContent = statusData?.updated_at
      ? '마지막 갱신: ' + new Date(statusData.updated_at).toLocaleString('ko-KR')
      : '아직 갱신 데이터 없음';

    const merged = mergedHoldings();
    const needsAction = merged.filter(h=>['buy','sell','sellall'].includes(h.signal_type));
    const box = document.getElementById('alertBox');
    if(needsAction.length===0){
      box.innerHTML = `<div class="alert-box empty"><div class="alert-title">🔔 알림</div><div style="font-size:12.5px;color:var(--ink-soft);">현재 조치가 필요한 종목이 없습니다.</div></div>`;
    } else {
      const rows = needsAction.map(h=>`<div class="alert-row"><span><b>${h.name}</b> (${fmtPct(h.change_pct)})</span>${signalHTML(h.signal_type, h.signal_label)}</div>`).join('');
      box.innerHTML = `<div class="alert-box"><div class="alert-title">🔔 조치가 필요한 종목 (${needsAction.length})</div>${rows}</div>`;
    }

    const list = document.getElementById('dashList');
    list.innerHTML = merged.length===0
      ? `<div class="empty-state">보유종목 관리 탭에서 종목을 추가해 주세요.</div>`
      : merged.map(h=>`
        <div class="row" style="grid-template-columns:auto 1fr auto auto;">
          <span class="market-tag">${h.market==='domestic'?'국내':'해외'}</span>
          <div><span class="row-name">${h.name}</span><span class="row-ticker">${h.code||''}</span>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">매입가 ${fmtNum(h.buy_price)} · 현재가 ${fmtNum(h.current_price)}</div></div>
          <span class="change-pct ${pctClass(h.change_pct)}">${fmtPct(h.change_pct)}</span>
          ${signalHTML(h.signal_type||'unknown', h.signal_label||'대기중')}
        </div>`).join('');
  }

  function renderHoldingsManage(){
    const list = document.getElementById('holdingsList');
    const merged = mergedHoldings();
    list.innerHTML = merged.length===0
      ? `<div class="empty-state">아직 보유종목이 없습니다.</div>`
      : merged.map(h=>`
        <div class="row">
          <span class="market-tag">${h.market==='domestic'?'국내':'해외'}</span>
          <div><span class="row-name">${h.name}</span><span class="row-ticker">${h.code||''}</span>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">매입가 ${fmtNum(h.buy_price)}</div></div>
          <span class="change-pct ${pctClass(h.change_pct)}">${fmtPct(h.change_pct)}</span>
          ${signalHTML(h.signal_type||'unknown', h.signal_label||'대기중')}
          <button class="del-btn" data-id="${h.id}" title="삭제">✕</button>
        </div>`).join('');
    list.querySelectorAll('.del-btn').forEach(btn=>{ btn.onclick = ()=>removeHolding(btn.dataset.id); });
  }

  function renderWatchManage(){
    const list = document.getElementById('watchList');
    const wl = mergedWatchlist();
    list.innerHTML = wl.length===0
      ? `<div class="empty-state">관심종목이 없습니다.</div>`
      : wl.map(w=>`
        <div class="row watch">
          <span>★</span>
          <div><span class="row-name">${w.name}</span><span class="row-ticker">${w.code||''}</span></div>
          <span class="market-tag">${w.market==='domestic'?'국내':'해외'}</span>
          <span class="change-pct flat">${fmtNum(w.current_price)}</span>
          <button class="del-btn" data-id="${w.id}" title="삭제">✕</button>
        </div>`).join('');
    list.querySelectorAll('.del-btn').forEach(btn=>{ btn.onclick = ()=>removeWatch(btn.dataset.id); });
  }

  function renderDashboardWatch(){
    const wl = mergedWatchlist();
    const list = document.getElementById('dashWatchList');
    list.innerHTML = wl.length===0
      ? `<div class="empty-state">관심종목 관리 탭에서 종목을 추가해 주세요.</div>`
      : wl.map(w=>`
        <div class="row" style="grid-template-columns:auto 1fr auto;">
          <span class="market-tag">${w.market==='domestic'?'국내':'해외'}</span>
          <div><span class="row-name">${w.name}</span><span class="row-ticker">${w.code||''}</span></div>
          <span class="change-pct flat">${fmtNum(w.current_price)}</span>
        </div>`).join('');
  }

  function renderAll(){
    renderDashboard();
    renderDashboardWatch();
    renderHoldingsManage();
    renderWatchManage();
  }

  // ---- 서버(Vercel) API 호출: 토큰은 서버에만 있음, 브라우저는 PIN만 보냄 ----
  async function callHoldingsApi(action, item, statusElId, pinOverride){
    const statusEl = document.getElementById(statusElId);
    statusEl.textContent = '저장 중...';
    statusEl.className = 'status-msg';
    try{
      const res = await fetch('/api/holdings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-dashboard-pin': pinOverride ?? getPin() },
        body: JSON.stringify({ action, item }),
      });
      if(res.status === 401){
        statusEl.textContent = '';
        openPinModal(() => callHoldingsApi(action, item, statusElId));
        return null;
      }
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
      holdingsFile = data.data;
      statusEl.textContent = '저장 완료! 잠시 후 Actions가 시세를 갱신합니다.';
      statusEl.className = 'status-msg ok';
      renderAll();
      return data;
    }catch(e){
      console.error(e);
      statusEl.textContent = '오류: ' + e.message;
      statusEl.className = 'status-msg err';
      return null;
    }
  }

  function addHolding(){
    const market = document.getElementById('h-market').value;
    const name = document.getElementById('h-name').value.trim();
    const code = document.getElementById('h-code').value.trim();
    const buy = parseFloat(document.getElementById('h-buy').value);
    if(!name || !buy){ alert('종목명과 매입가는 필수입니다.'); return; }
    callHoldingsApi('add_holding', { id: uid(), market, name, code, buy_price: buy }, 'h-status').then((ok)=>{
      if(ok){
        document.getElementById('h-name').value='';
        document.getElementById('h-code').value='';
        document.getElementById('h-buy').value='';
      }
    });
  }

  function removeHolding(id){
    if(!confirm('이 종목을 삭제할까요?')) return;
    callHoldingsApi('remove_holding', { id }, 'h-status');
  }

  function addWatch(){
    const market = document.getElementById('w-market').value;
    const name = document.getElementById('w-name').value.trim();
    const code = document.getElementById('w-code').value.trim();
    if(!name){ alert('종목명을 입력해 주세요.'); return; }
    callHoldingsApi('add_watch', { id: uid(), market, name, code }, 'w-status').then((ok)=>{
      if(ok){
        document.getElementById('w-name').value='';
        document.getElementById('w-code').value='';
      }
    });
  }

  function removeWatch(id){
    if(!confirm('이 종목을 삭제할까요?')) return;
    callHoldingsApi('remove_watch', { id }, 'w-status');
  }

  // ---- PIN 모달 ----
  let pendingRetry = null;
  function openPinModal(retryFn){
    pendingRetry = retryFn || null;
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-status').textContent = '';
    document.getElementById('pinModal').classList.add('active');
    document.getElementById('pin-input').focus();
  }
  function closePinModal(){ document.getElementById('pinModal').classList.remove('active'); }

  document.getElementById('pin-cancel').onclick = closePinModal;
  document.getElementById('pinModal').addEventListener('click', (e)=>{ if(e.target.id==='pinModal') closePinModal(); });
  document.getElementById('pin-confirm').onclick = ()=>{
    const pin = document.getElementById('pin-input').value.trim();
    if(!pin){ document.getElementById('pin-status').textContent='PIN을 입력해 주세요.'; document.getElementById('pin-status').className='status-msg err'; return; }
    setPin(pin);
    closePinModal();
    if(pendingRetry) pendingRetry();
  };
  document.getElementById('pin-input').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('pin-confirm').click();
  });

  document.getElementById('h-add-btn').onclick = addHolding;
  document.getElementById('w-add-btn').onclick = addWatch;

  // ---- 수동 시세 조회 버튼 ----
  async function triggerRefresh(pinOverride){
    const btn = document.getElementById('refreshNowBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '요청 중...';
    try{
      const res = await fetch('/api/trigger-refresh', {
        method: 'POST',
        headers: { 'x-dashboard-pin': pinOverride ?? getPin() },
      });
      if(res.status === 401){
        btn.disabled = false;
        btn.textContent = originalText;
        openPinModal(() => triggerRefresh());
        return;
      }
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
      btn.textContent = '요청 완료! (1~2분 후 갱신)';
      setTimeout(()=>{ btn.textContent = originalText; btn.disabled = false; }, 5000);
    }catch(e){
      console.error(e);
      alert('시세 조회 요청 중 오류가 발생했습니다: ' + e.message);
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }
  document.getElementById('refreshNowBtn').onclick = () => triggerRefresh();

  // ---- 종목 검색 (자동완성) ----
  function setupStockSearch(nameInputId, dropdownId, marketSelectId, codeInputId){
    const nameInput = document.getElementById(nameInputId);
    const dropdown = document.getElementById(dropdownId);
    const marketSelect = document.getElementById(marketSelectId);
    const codeInput = document.getElementById(codeInputId);
    let debounceTimer = null;
    let currentQuery = '';

    async function runSearch(q){
      const market = marketSelect.value;
      try{
        let results;
        if(market === 'domestic'){
          const stocks = await loadKrxStocks();
          results = stocks
            .filter(s => s.name.includes(q))
            .slice(0, 8)
            .map(s => ({ name: s.name, code: s.code, extra: s.market_label }));
        } else {
          const res = await fetch(`/api/search-stock?q=${encodeURIComponent(q)}&market=overseas`);
          const data = await res.json();
          results = data.results || [];
        }
        if(q !== currentQuery) return;
        renderDropdown(results);
      }catch(e){
        console.error('검색 오류', e);
        dropdown.innerHTML = `<div class="search-empty">검색 중 오류가 발생했습니다. 코드를 직접 입력해 주세요.</div>`;
        dropdown.classList.add('active');
      }
    }

    function renderDropdown(results){
      if(results.length === 0){
        dropdown.innerHTML = `<div class="search-empty">검색 결과가 없습니다. 코드를 직접 입력해 주세요.</div>`;
        dropdown.classList.add('active');
        return;
      }
      dropdown.innerHTML = results.map(r => `
        <div class="search-item" data-name="${r.name.replace(/"/g,'&quot;')}" data-code="${r.code}">
          <span class="si-name">${r.name}</span><span class="si-code">${r.code}</span>
          ${r.extra ? `<div class="si-extra">${r.extra}</div>` : ''}
        </div>`).join('');
      dropdown.classList.add('active');
      dropdown.querySelectorAll('.search-item').forEach(item=>{
        item.addEventListener('click', ()=>{
          nameInput.value = item.dataset.name;
          codeInput.value = item.dataset.code;
          dropdown.classList.remove('active');
        });
      });
    }

    nameInput.addEventListener('input', ()=>{
      const q = nameInput.value.trim();
      currentQuery = q;
      clearTimeout(debounceTimer);
      if(q.length < 2){ dropdown.classList.remove('active'); return; }
      debounceTimer = setTimeout(()=>runSearch(q), 300);
    });

    document.addEventListener('click', (e)=>{
      if(!dropdown.contains(e.target) && e.target !== nameInput){
        dropdown.classList.remove('active');
      }
    });
  }

  setupStockSearch('h-name', 'h-dropdown', 'h-market', 'h-code');
  setupStockSearch('w-name', 'w-dropdown', 'w-market', 'w-code');

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });

  (async function init(){
    await loadPublicData();
    renderAll();
  })();
})();
</script>
</body>
