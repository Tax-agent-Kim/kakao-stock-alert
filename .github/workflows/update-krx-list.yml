name: KRX 상장종목 목록 갱신

on:
  schedule:
    - cron: "0 20 1 * *"   # 매월 1일 UTC 20:00 (KST 다음날 05:00) 자동 실행
  workflow_dispatch: {}    # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: KRX 목록 갱신
        run: python scripts/update_krx_list.py

      - name: 변경사항 커밋
        run: |
          git config user.name "krx-list-bot"
          git config user.email "actions@github.com"
          git add data/krx_stocks.json
          git diff --staged --quiet || git commit -m "chore: KRX 상장종목 목록 갱신 $(date -u +'%Y-%m-%d')"
          git push
